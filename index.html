<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<title>Million Трекер</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@500;600;700&display=swap">
<style>
/* Layout: one-column phone app, sticky workout bar on top, tab bar fixed at the bottom; numbers set like a gym scoreboard */
:root{
  --bg:#F2F3F6; --card:#FFFFFF; --surface:#E7E9EE; --fg:#13161B; --muted:#687080; --line:#DADEE5;
  --accent:#D3382B; --on-accent:#FFFFFF; --good:#1D9452;
  --display:"Unbounded","Arial Black",system-ui,sans-serif;
  --body:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:18px; --tabh:64px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1013; --card:#181B20; --surface:#22262D; --fg:#ECEEF2; --muted:#8C94A3; --line:#2B3038;
  --accent:#FF5B47; --on-accent:#FFFFFF; --good:#3CC97C; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0E1013; --card:#181B20; --surface:#22262D; --fg:#ECEEF2; --muted:#8C94A3; --line:#2B3038;
  --accent:#FF5B47; --on-accent:#FFFFFF; --good:#3CC97C; color-scheme:dark;}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font:500 15px/1.45 var(--body);-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px calc(var(--tabh) + 96px + env(safe-area-inset-bottom,0px))}
.num{font-family:var(--display);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font:700 26px/1.15 var(--display);letter-spacing:-.02em}
h2{font:700 12px/1 var(--body);text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:24px 2px 10px}
h3{font:700 17px/1.25 var(--body)}
.muted{color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:10px}

.demo{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--surface);border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:12px}
.demo button{font-weight:700;color:var(--accent);white-space:nowrap}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:14px;padding:14px 18px;font-weight:700;font-size:16px;background:var(--surface);transition:transform .08s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.wide{width:100%}
.btn.danger{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
.link{color:var(--muted);font-size:13px;font-weight:600;padding:6px 2px}

.hero{background:var(--card);border-radius:var(--r);padding:22px 18px 18px;display:flex;flex-direction:column;gap:14px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--accent)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--card);border-radius:14px;padding:12px;min-width:0}
.tile .num{font-size:19px;font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile small{font-size:12px;color:var(--muted)}

.wbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--bg);padding:6px 0 12px}
.wbar .timer{font:600 28px/1 var(--display);font-variant-numeric:tabular-nums}
.wbar .live{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.08em;margin-top:4px}
.wbar .live::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent);animation:pulse 1.6s infinite}
.wbar .sum{text-align:right;font-size:12px;color:var(--muted)}
.wbar .sum b{font:600 17px/1.2 var(--display);color:var(--fg);display:block}
@keyframes pulse{50%{opacity:.25}}

.ex{background:var(--card);border-radius:var(--r);overflow:hidden}
.ex>header{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:14px 16px;width:100%;text-align:left}
.ex>header .meta{font-size:13px;color:var(--muted);white-space:nowrap}
.ex .body{padding:0 16px 16px;display:flex;flex-direction:column;gap:14px}
.ex:not(.open) .sets{padding:0 16px 14px}
.sets{display:flex;flex-wrap:wrap;gap:6px}
.sets:empty{display:none}
.chip{display:inline-flex;align-items:baseline;gap:2px;background:var(--surface);border-radius:9px;padding:5px 9px;font:600 13px/1.2 var(--display);font-variant-numeric:tabular-nums}
.chip b{font-weight:500;color:var(--muted);margin:0 1px}
.chip em{font-style:normal;color:var(--accent);margin-left:4px}
.chip.wu{background:transparent;border:1px dashed var(--line);color:var(--muted)}
.chip i{font-style:normal;display:inline-grid;place-items:center;align-self:center;min-width:18px;height:18px;padding:0 4px;border-radius:6px;background:var(--card);color:var(--muted);font:800 11px/1 var(--body);margin-right:6px}
.chip.wu i{background:var(--surface)}

.steppers{display:grid;grid-template-columns:1.25fr 1fr;gap:10px}
.stepper{background:var(--surface);border-radius:14px;padding:8px;display:grid;grid-template-columns:40px 1fr 40px;align-items:center;gap:4px;min-width:0}
.stepper button{height:44px;border-radius:11px;background:var(--card);font:600 22px/1 var(--body)}
.stepper label{display:flex;flex-direction:column;align-items:center;min-width:0}
.stepper input{width:100%;min-width:0;background:transparent;border:0;color:var(--fg);text-align:center;font:600 24px/1.1 var(--display);font-variant-numeric:tabular-nums;padding:0;-moz-appearance:textfield}
.stepper input::-webkit-inner-spin-button{-webkit-appearance:none}
.stepper span{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.08em}

.plates{display:flex;align-items:center;gap:10px;min-height:34px}
.bar{display:flex;align-items:center;height:34px;flex:none}
.bar .sleeve{width:22px;height:6px;background:var(--muted);border-radius:2px;opacity:.6}
.bar .pl{width:7px;height:var(--h);background:var(--c);border-radius:2px;margin-left:2px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.18)}
.pl-note{font-size:12px;color:var(--muted);min-width:0}

.actions{display:grid;grid-template-columns:auto 1fr;gap:10px}
.toggle{border-radius:14px;padding:0 14px;font-weight:700;font-size:14px;border:1.5px solid var(--line);color:var(--muted)}
.toggle[aria-pressed="true"]{border-color:var(--fg);color:var(--fg);background:var(--surface)}

.addex{border:1.5px dashed var(--line);border-radius:var(--r);padding:16px;font-weight:700;color:var(--muted);width:100%}

.hist{display:grid;grid-template-columns:52px 1fr auto;align-items:center;gap:12px;background:var(--card);border-radius:var(--r);padding:12px 14px;width:100%;text-align:left}
.hist .d{text-align:center;line-height:1}
.hist .d .num{font-size:22px;font-weight:600;display:block}
.hist .d small{font-size:11px;color:var(--muted);text-transform:uppercase;font-weight:700;letter-spacing:.06em}
.hist .names{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;min-width:0}
.hist .sub{font-size:12px;color:var(--muted)}
.hist .t{text-align:right;white-space:nowrap}
.hist .t .num{font-size:15px;font-weight:600;display:block}
.hist .t small{font-size:11px;color:var(--muted)}

.pills{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.pill{white-space:nowrap;border-radius:999px;padding:8px 14px;background:var(--card);font-weight:700;font-size:14px}
.pill[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.chart{background:var(--card);border-radius:var(--r);padding:14px 10px 8px}
.chart svg{display:block;width:100%;height:auto}
.chart .lbl{fill:var(--muted);font:600 10px var(--body)}
.chart .val{fill:var(--fg);font:600 11px var(--display)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart .ar{fill:var(--accent);opacity:.12}
.chart .dot{fill:var(--accent)}
.chart .cap{font-size:12px;color:var(--muted);padding:2px 6px 4px}
.rows{background:var(--card);border-radius:var(--r);padding:4px 14px}
.row{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px}
.row:last-child{border-bottom:0}
.row .num{font-size:13px;font-weight:600;white-space:nowrap}

.empty{background:var(--card);border-radius:var(--r);padding:28px 18px;text-align:center;color:var(--muted)}
.empty.sm{padding:18px;font-size:14px}
.tiles.two{grid-template-columns:repeat(2,1fr)}
.conv{align-self:flex-start;font-size:13px;color:var(--muted);margin-top:-6px;padding:2px 0}
.conv b{color:var(--fg);font-family:var(--display);font-weight:600}
.conv u{text-decoration:none;color:var(--accent);font-weight:700}
.conv2{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:end}
.conv2 label{min-width:0}
.conv2 .eq{font:600 20px/1 var(--display);color:var(--muted);padding-bottom:16px}
.seg.two{grid-template-columns:repeat(2,1fr)}
.tier{background:var(--card);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;border:1.5px solid var(--line)}
.tier.cur{border-color:var(--accent)}
.tier-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.tier-h h3{font:700 20px/1.1 var(--display)}
.tier-h .pr{font:600 16px/1 var(--display);white-space:nowrap}
.tier-h .pr small{font:600 12px var(--body);color:var(--muted)}
.tier ul{margin:0;padding:0 0 0 18px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.tier .tag{margin:0;font-size:15px;line-height:1.4;font-weight:600}
.tier .tdesc{margin:0;font-size:14px;line-height:1.45;color:var(--muted)}
.tier .tget{font:700 12px/1 var(--body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-top:4px}
.tier ul.tfeat{list-style:none;padding:0;gap:8px;line-height:1.4}
.tier ul.tfeat li{position:relative;padding-left:22px}
.tier ul.tfeat li::before{content:"✓";position:absolute;left:0;top:0;color:var(--good);font-weight:800}
.tier .tmain{background:color-mix(in srgb,var(--accent) 12%,transparent);border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.45}
.tintro{display:flex;flex-direction:column;gap:4px;margin-top:10px;font-size:14px;line-height:1.45;color:var(--muted)}
.tintro b{color:var(--fg);font-size:16px}
.tier .badge{align-self:flex-start;font:800 11px/1 var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--accent);background:var(--surface);border-radius:6px;padding:5px 7px}
.why{background:var(--surface);border-radius:12px;padding:10px 12px;font-size:14px;font-weight:600}
.bwrow .sub b{color:var(--accent)}
.h2row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:24px 2px 10px}
.h2row h2{margin:0}
.h2row .link{color:var(--accent);font-size:14px;padding:4px 2px}
.hfilter{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 4px;margin:18px 0 6px;scrollbar-width:none}
.hfilter::-webkit-scrollbar{display:none}
.hfilter button{flex:none;padding:9px 14px;border-radius:999px;background:var(--card);color:var(--fg);font:600 14px var(--body);border:0;cursor:pointer;white-space:nowrap}
.hfilter button small{opacity:.65;font-weight:600;margin-left:4px}
.hfilter button[aria-pressed="true"]{background:var(--accent);color:#fff}
.who{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin:0 0 4px 2px}
.morebtn{width:100%;margin-top:4px}
.prevf{background:var(--surface);border-radius:12px;padding:10px 12px;margin:2px 0 8px;display:flex;flex-direction:column;gap:8px}
.prevf .pfh{display:flex;justify-content:space-between;gap:8px;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.prevf .chip{background:var(--card)}
.prevf .pfc{font-size:13px;color:var(--muted);line-height:1.35}
.wtitle{display:flex;align-items:center;gap:8px;width:100%;background:transparent;border:0;color:var(--fg);font:700 19px var(--display);padding:4px 2px;margin:2px 0 10px;text-align:left;cursor:pointer}
.wtitle.empty{color:var(--muted);font:600 14px var(--body)}
.wtitle svg{flex:none;color:var(--muted)}
.renb{display:inline-flex;align-items:center;gap:6px;background:transparent;border:0;color:var(--accent);font:600 14px var(--body);padding:6px 0;cursor:pointer}
.hist .names b{color:var(--fg)}
.psum{font-size:14px;color:var(--muted);font-weight:600}
.pfold{align-self:flex-start;color:var(--accent);font-size:14px;font-weight:700;padding:2px 0}
.plan{background:var(--card);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:10px;border:1.5px dashed color-mix(in srgb,var(--accent) 50%,transparent)}
.plan-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.plan-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.plan-list>li{display:flex;flex-direction:column;gap:2px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.plan-list>li:last-child{border-bottom:0}
.setlist{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:5px}
.setlist li{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:0 10px;font-size:14px}
.setlist .ord{color:var(--muted)}
.setlist .val{font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.setlist li.pdone{opacity:.5;text-decoration:line-through}
.setlist li.pnext .ord,.setlist li.pnext .val{color:var(--accent)}
.plan-list .num{font-size:13px;font-weight:600;text-align:right}
.day.plan .mk{border:1.5px solid var(--accent);color:var(--accent);border-radius:6px;padding:0 4px;line-height:13px}
.target{font-size:13px;color:var(--muted);margin-top:-4px}
.target b{color:var(--fg)}
.ex>header .meta.done{color:var(--good);font-weight:700}
.pitem{background:var(--card);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px}
.pitem-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pitem-h button{width:32px;height:32px;flex:none;border-radius:10px;background:var(--surface);font-size:18px}
.srow{display:grid;grid-template-columns:24px 1.25fr 1fr 30px 30px;gap:5px;align-items:center}
.scm{height:34px;border-radius:9px;background:var(--surface);color:var(--muted);display:grid;place-items:center}
.scm svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linejoin:round}
.scm.on{color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--surface))}
.cin{width:100%;min-width:0;border:1.5px solid var(--line);background:var(--card);color:var(--fg);border-radius:10px;padding:8px 10px;font:500 14px var(--body);resize:none}
.cin.sm{margin:-2px 0 2px 29px;width:calc(100% - 29px);padding:6px 9px;font-size:13px}
.cm{width:100%;font-size:12.5px;color:var(--muted);font-style:italic;margin-top:1px}
.cm:before{content:"💬 ";font-style:normal}
.coachnote{background:color-mix(in srgb,var(--accent) 10%,var(--surface));border-radius:12px;padding:9px 11px;font-size:14px}
.coachnote b{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:2px}
.mynote{background:var(--surface);border-radius:12px;padding:9px 11px;font-size:14px}
.mynote b{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.chip.hasc{box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--accent) 55%,transparent)}
button.chip{cursor:pointer}
.kcal{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-weight:600}
.kcal .num{font-size:30px;font-weight:600}
.mbar{height:5px;border-radius:3px;background:var(--surface);overflow:hidden;margin-top:6px}
.mbar.big{height:8px;margin-top:8px}
.mbar i{display:block;height:100%;background:var(--good);border-radius:3px}
.meal{background:var(--card);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.meal.eaten{box-shadow:inset 0 0 0 1.5px var(--good)}
.meal-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.mname{flex:1;min-width:0;border:0;background:transparent;color:var(--fg);font:700 17px var(--body);padding:2px 0;border-bottom:1.5px dashed transparent}
.mname:focus{border-bottom-color:var(--line);outline:none}
.mk2{font:600 14px var(--display);white-space:nowrap;font-variant-numeric:tabular-nums}
.fl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.fl li{display:grid;grid-template-columns:1fr auto 30px;gap:8px;align-items:center;padding:7px 0;border-top:1px solid var(--line)}
.fl li b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fl li small{font-size:12px;color:var(--muted)}
.fl .fk{font:600 14px var(--display);font-variant-numeric:tabular-nums}
.meal-f{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px}
.toggle.eat{padding:8px 12px;font-size:13px}
.toggle.eat[aria-pressed="true"]{border-color:var(--good);color:var(--good);background:transparent}
.fres{display:flex;justify-content:space-between;align-items:baseline;gap:10px;background:var(--card);border-radius:12px;padding:10px 12px;text-align:left}
.fres span{font-weight:600;font-size:14px;min-width:0}
.fres small{font-size:12px;color:var(--muted);white-space:nowrap}
.fres.on{box-shadow:inset 0 0 0 1.5px var(--good)}
.fform{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fform label{min-width:0}
.fform .wide2{grid-column:1/-1}
.famt{display:flex;flex-direction:column;gap:8px}
.seg.unit button{text-align:center;align-items:center;padding:9px 6px;background:var(--surface);font-weight:700;font-size:14px}
.mdays .day{padding:8px 0 6px}
.tile.mt .num{white-space:normal;overflow:visible;font-size:18px}
.chip.ok{box-shadow:inset 0 0 0 1.5px var(--good)}
.chip.low{box-shadow:inset 0 0 0 1.5px var(--accent)}
.clist{margin:2px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--muted)}
.clist li:before{content:"💬 "}
.snb{height:34px;border-radius:9px;font:800 12px/1 var(--body);color:var(--muted);background:transparent;border:1.5px dashed transparent}
.snb:hover{border-color:var(--line)}
.snb.wu{background:var(--surface);color:var(--accent);border-color:var(--accent)}
.stepb{align-self:flex-start;border-radius:999px;padding:5px 10px;background:var(--surface);font-weight:700;font-size:12px;color:var(--muted)}
.stepb b{color:var(--fg)}
.pct{background:var(--card);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px;border:1.5px solid var(--line)}
.pct-row{display:grid;grid-template-columns:44px 1fr 44px;gap:6px;align-items:center}
.pct-row>button{height:44px;border-radius:11px;background:var(--surface);font:600 20px/1 var(--body)}
.pct-in{display:flex;align-items:baseline;justify-content:center;gap:2px;background:var(--surface);border-radius:11px;height:44px;align-items:center}
.pct-in input{width:64px;background:transparent;border:0;color:var(--fg);text-align:right;font:600 20px var(--display);padding:0}
.pct-in span{font:600 18px var(--display);color:var(--muted)}
.seg.three{grid-template-columns:repeat(3,1fr)}
.seg.three button{padding:9px 6px;text-align:center;align-items:center;background:var(--surface)}
.pct-msg{font-size:13px;color:var(--muted)}
.sn{font:800 12px/1 var(--body);color:var(--muted);text-align:center}

/* plans are keyed by local date "YYYY-MM-DD" */
const dkey=d=>{ d=new Date(d); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
const fromKey=k=>{ const [y,m,dd]=k.split("-").map(Number); return new Date(y,m-1,dd); };
const todayKey=()=>dkey(new Date());
const planOn=k=>S.plans.find(p=>p.date===k && !p.who);
const pdateLong=k=>{ const d=fromKey(k); return WDF[(d.getDay()+6)%7]+", "+d.getDate()+" "+MONG[d.getMonth()]; };
const pdate=k=>{ const d=fromKey(k); return WDS[(d.getDay()+6)%7]+", "+d.getDate()+" "+MON[d.getMonth()]; };
const dshort=t=>{ const d=new Date(t); return d.getDate()+" "+MON[d.getMonth()]; };
function dur(ms){ const s=Math.max(0,Math.floor(ms/1000)); const h=Math.floor(s/3600), m=Math.floor(s%3600/60), ss=s%60;
  return h? h+":"+String(m).padStart(2,"0")+":"+String(ss).padStart(2,"0") : String(m).padStart(2,"0")+":"+String(ss).padStart(2,"0"); }
const mins=ms=>Math.max(1,Math.round(ms/60000));
const hm=ms=>{ const m=Math.max(1,Math.round(ms/60000)), h=Math.floor(m/60); return h? h+L(" ч ")+String(m%60).padStart(2,"0")+L(" мин") : m+L(" мин"); };
const mmss=sec=>{ const t=Math.max(0,Math.round(sec)); return Math.floor(t/60)+":"+String(t%60).padStart(2,"0"); };
/* every set stores seconds from workout start in s[4]; rest before a set = gap since the previous set */
function rests(sets){ const m=new Map(); for(let i=1;i<sets.length;i++){ const a=sets[i-1][4], b=sets[i][4]; if(a!=null && b!=null && b>=a) m.set(sets[i],b-a); } return m; }
function restStats(vals){ const v=vals.filter(x=>x!=null && x<=1200); if(!v.length) return null; const tot=v.reduce((a,b)=>a+b,0); return {avg:tot/v.length,tot,n:v.length}; }
function haptic(kind){ try{ if(!tg||!tg.HapticFeedback) return;
  if(kind==="ok") tg.HapticFeedback.notificationOccurred("success"); else tg.HapticFeedback.impactOccurred(kind||"light"); }catch(_){} }

function totals(sets){ let n=0,t=0; for(const s of sets){ if(!s[3]){ n++; t+=s[1]*s[2]; } } return {n,t}; }
/* calories estimate: MET x body weight (kg) x hours; weight and intensity are saved with each finished workout */
function kcal(w){ const bw=w.bw||S.bw; if(!bw) return null; const met=w.met||S.met; return Math.round(met*bw*(((w.e||Date.now())-w.s)/3600000)); }
const kc=v=> v==null ? "" : "≈"+fmt(v)+L(" ккал");
function byEx(sets){ const m=new Map(); for(const s of sets){ if(!m.has(s[0])) m.set(s[0],[]); m.get(s[0]).push(s); } return m; }
function lastSet(x){
  const scan=sets=>{ for(let i=sets.length-1;i>=0;i--){ const s=sets[i]; if(s[0]===x && !s[3]) return s; } return null; };
  if(S.act){ const l=scan(S.act.sets); if(l) return l; }
  for(const w of S.hist){ const l=scan(w.sets); if(l) return l; }
  return null;
}
function draft(x){ if(!S.draft[x]){ const l=lastSet(x); S.draft[x]={w:l?l[1]:20,r:l?l[2]:10,wu:false}; } return S.draft[x]; }

/* each set on its own chip: working sets numbered 1, 2, 3…, warm-ups marked «Р» */
/* "ok" when reps and weight reach the planned set, "low" when below it */
const vsPlan=(w,r,pz)=> !pz ? "" : (r>=pz[1] && (!(pz[0]>0) || w>=pz[0]-0.01)) ? " ok" : " low";
function chips(sets,rm,act,plan){
  let n=0, m=0; const pw=plan?plan.filter(z=>!z[2]):null, pu=plan?plan.filter(z=>z[2]):null;
  const out=sets.map(s=>{
    const lab = s[3] ? L("Р") : String(++n), r=rm&&rm.get(s), tag=act?"button":"span";
    const st=plan ? vsPlan(s[1],s[2], s[3] ? pu[m++] : pw[n-1]) : "";
    return '<'+tag+' class="chip'+(s[3]?" wu":"")+(s[5]?" hasc":"")+st+'"'+(act?' data-a="setc" data-x="'+S.act.sets.indexOf(s)+'"':"")+' title="'+(s[3]?L("Разминочный подход"):L("Рабочий подход ")+n)+(r!=null?L(", отдых перед ним ")+mmss(r):"")+(s[5]?" · "+esc(s[5]):"")+'"><i>'+lab+'</i>'+fw(s[1])+"<b>×</b>"+s[2]+(r!=null?"<s>"+mmss(r)+"</s>":"")+"</"+tag+">";
  }).join("");
  return out;
}
/* comments written to logged sets, as a list under the chips */
function setComments(sets){ let n=0; const li=[];
  for(const s of sets){ const lab=s[3]?L("Р"):String(++n); if(s[5]) li.push('<li><b>'+lab+'</b> · '+esc(s[5])+'</li>'); }
  return li.length?'<ul class="clist">'+li.join("")+'</ul>':""; }

/* plates per side on a 20 kg bar, competition colours */
const PL=[[25,"#D3382B",100],[20,"#2563EB",100],[15,"#E3B000",90],[10,"#1D9452",80],[5,"#F4F4F2",62],[2.5,"#D3382B",48],[1.25,"#A3A8B1",40]];
const PLB=[[45,"#2563EB",100],[35,"#E3B000",92],[25,"#1D9452",84],[10,"#F4F4F2",62],[5,"#D3382B",48],[2.5,"#A3A8B1",40]];
function plates(kg){
  const lb=isLb(), w=Math.round((lb?kg*LB:kg)*100)/100, bar=lb?45:20, P=lb?PLB:PL;
  if(w<bar) return L('<div class="plates"><span class="pl-note">Легче грифа (')+bar+' '+U()+')</span></div>';
  if(w>(lb?900:400)) return "";
  let side=(w-bar)/2; const list=[];
  for(const [p,c,h] of P){ while(side>=p-1e-6 && list.length<14){ list.push([p,c,h]); side-=p; } }
  const html=list.map(([p,c,h])=>'<span class="pl" style="--h:'+h+'%;--c:'+c+'" title="'+fmt(p)+' '+U()+'"></span>').join("");
  const txt = list.length ? L("На сторону: ")+list.map(p=>fmt(p[0])).join(" + ")+" "+U()+(side>0.01?" (≈)":"") : L("Пустой гриф");
  return '<div class="plates"><div class="bar"><span class="sleeve"></span>'+html+'</div><span class="pl-note">'+txt+"</span></div>";
}
function platesKgOnly(w){
  if(w<20) return L('<div class="plates"><span class="pl-note">Легче олимпийского грифа (20 кг)</span></div>');
  if(w>400) return "";
  let side=(w-20)/2; const list=[];
  for(const [p,c,h] of PL){ while(side>=p-1e-9 && list.length<14){ list.push([p,c,h]); side-=p; } }
  const html=list.map(([p,c,h])=>'<span class="pl" style="--h:'+h+'%;--c:'+c+'" title="'+fmt(p)+L(' кг"></span>')).join("");
  const txt = list.length ? L("На сторону: ")+list.map(p=>fmt(p[0])).join(" + ")+L(" кг")+(side>0.01?" (≈)":"") : L("Пустой гриф");
  return '<div class="plates"><div class="bar"><span class="sleeve"></span>'+html+'</div><span class="pl-note">'+txt+"</span></div>";
}

/* ---------- persistence ---------- */
const saveEx=()=>store.set("ex",JSON.stringify(S.ex));
const saveAct=()=>{ if(S.act) store.set("act",JSON.stringify(S.act)); else store.del("act"); };
const saveIdx=()=>store.set("idx",JSON.stringify(S.hist.map(w=>w.id)));
const saveCfg=()=>store.set("cfg",JSON.stringify({rest:S.restSec,demo:S.demo,bw:S.bw,met:S.met,unit:S.unit,lang:S.lang||LANG,snd:S.snd!==false}));
const savePlans=()=>store.set("plans",JSON.stringify(S.plans));
const saveRidx=()=>store.set("ridx",JSON.stringify(S.reps.map(r=>r.id)));
function saveRep(r){ store.set("r_"+r.id,JSON.stringify(r)); saveRidx(); }
function saveW(w){ store.set("w_"+w.id,JSON.stringify(w)); saveIdx(); }

async function load(){
  const base=await store.get(["ex","idx","act","cfg","plans","seen","ridx"]);
  S.ex=parse(base.ex,[]); S.act=parse(base.act,null); S.plans=parse(base.plans,[]); S.seen=parse(base.seen,[]); S.plans.forEach(p=>p.items.forEach(normItem)); if(S.act&&S.act.plan) S.act.plan.forEach(normItem);
  const cfg=parse(base.cfg,{}); S.restSec=cfg.rest||90; S.demo=!!cfg.demo; S.bw=cfg.bw||0; S.met=cfg.met||5; S.unit=cfg.unit==="lb"?"lb":"kg"; S.lang=cfg.lang; S.snd=cfg.snd!==false;
  { let ls=null; try{ ls=localStorage.getItem("tb_lang"); }catch(_){} if(!ls && cfg.lang && cfg.lang!==LANG && /^(ru|uk|en)$/.test(cfg.lang)){ try{ localStorage.setItem("tb_lang",cfg.lang); location.reload(); return; }catch(_){} } }
  const idx=parse(base.idx,[]); const ws=[];
  for(let i=0;i<idx.length;i+=40){
    const part=idx.slice(i,i+40); const got=await store.get(part.map(id=>"w_"+id));
    for(const id of part){ const w=parse(got["w_"+id],null); if(w) ws.push(w); }
  }
  S.hist=ws.sort((a,b)=>b.s-a.s);
  const ridx=parse(base.ridx,[]); const rs=[];
  for(let i=0;i<ridx.length;i+=40){
    const part=ridx.slice(i,i+40); const got=await store.get(part.map(id=>"r_"+id));
    for(const id of part){ const r=parse(got["r_"+id],null); if(r) rs.push(r); }
  }
  rs.forEach(r=>r.e.forEach(e=>{ if(Array.isArray(e[2]) && !Array.isArray(e[2][0])) e[2]=Array.from({length:e[2][0]},()=>[e[2][2],e[2][1]]); }));
  S.reps=rs.sort((a,b)=>b.at-a.at);
  if(!inTG && !S.ex.length && !S.hist.length && !S.act) seedDemo();
}

function seedDemo(){
  S.ex=[L("Жим лёжа"),L("Присед со штангой"),L("Тяга верхнего блока"),L("Жим гантелей сидя")];
  const day=864e5, now=Date.now(), plan=[[0,2,3],[1,0,2],[0,3,1]], base=[80,100,55,22];
  for(let k=0;k<8;k++){
    const s=now-(23-k*3)*day-2*3600e3, sets=[]; let tt=0;
    for(const e of plan[k%3]){
      const w=base[e]+(e===3?Math.floor(k/3)*2:Math.floor(k/2)*2.5);
      const add=(...z)=>{ tt+=sets.length?70+((k*17+sets.length*29)%80):240; sets.push([...z,tt]); };
      add(e,Math.round(w*0.5/2.5)*2.5,10,1); add(e,w,8,0); add(e,w,8,0); add(e,w,k%2?7:6,0);
    }
    S.hist.push({id:"demo"+k,s,e:s+(sets[sets.length-1][4]+150)*1000,sets});
  }
  S.hist.sort((a,b)=>b.s-a.s); S.demo=true;
  S.plans=[{id:"pdemo1",date:dkey(new Date()),name:L("Ноги"),items:[{x:1,s:[[60,12],[80,10],[100,8],[110,5]]},{x:2,s:[[55,12],[60,10],[62.5,10]]}]},
           {id:"pdemo2",date:dkey(addDays(new Date(),2)),name:L("Грудь и плечи"),items:[{x:0,s:[[40,12],[60,10],[80,8],[92.5,6]]},{x:3,s:[[24,10],[26,10],[26,10]]}]},
           {id:"pdemo3",date:dkey(addDays(new Date(),1)),name:L("Верх тела"),who:L("Иван"),items:[{x:0,s:[[40,12],[55,10],[65,8],[70,6]]},{x:2,s:[[45,12],[50,10],[50,10],[50,10]]},{x:3,s:[[16,12],[18,12],[18,10]]}]}];
  savePlans();
  S.reps=[{id:"rdemo",at:Date.now()-864e5,c:L("Иван"),pid:"",n:L("Спина и плечи"),d:dkey(addDays(new Date(),-2)),m:64,
    e:[[L("Тяга верхнего блока"),[[45,12],[50,10,95],[52.5,10,110],[52.5,8,125]],[[45,12],[50,10],[52.5,10],[52.5,10]]],[L("Жим гантелей сидя"),[[16,12,180],[16,12,90],[18,10,105]],[[16,12],[18,12],[18,10]]],[L("Жим лёжа"),[[40,12,150],[55,10,100],[65,8,140]],[[40,12],[55,10],[65,8],[70,6]]]]}];
  S.reps.forEach(saveRep);
  saveEx(); S.hist.forEach(saveW); saveCfg();
}
function clearDemo(){
  S.hist.forEach(w=>store.del("w_"+w.id)); S.hist=[]; S.ex=[]; S.act=null; S.draft={}; S.demo=false; S.sel=null; S.plans=[]; savePlans(); S.reps.forEach(r=>store.del("r_"+r.id)); S.reps=[]; store.del("ridx"); if(S.mp.me){ delMP(S.mp.me); S.mp.me=null; } S.mp.list.slice().forEach(delMP);
  store.del("idx"); saveEx(); saveAct(); saveCfg(); render();
}

  const week=S.hist.filter(w=>w.s>Date.now()-7*864e5);

     '<div class="stack">'+(S.clHide?"":cl.map(planCard).join(""))+L('<button class="addex" data-a="pnew" data-x="client">+ План для клиента</button></div>');
  const tg2=(t,n,act,hid)=>'<div class="h2row"><h2>'+t+(n?" · "+n:"")+'</h2><button class="link" data-a="'+act+'">'+(hid?L("Показать"):L("Скрыть"))+'</button></div>';

function histItem(w){
  const t=totals(w.sets), m=byEx(w.sets), d=new Date(w.s);
  const names=[...m.keys()].map(x=>esc(S.ex[x]||"?")).join(", ");

/* week calendar: Monday to Sunday, with tonnage on days that had a workout */
/* week or month calendar, switchable */
function calView(){
  return '<div class="calseg" role="group"><button data-a="calm" data-x="w" aria-pressed="'+!S.calM+'">'+L("Неделя")+'</button><button data-a="calm" data-x="m" aria-pressed="'+S.calM+'">'+L("Месяц")+'</button></div>'+(S.calM?viewMonth():viewWeek());
}
function viewMonth(){
  const now=new Date(), base=new Date(now.getFullYear(),now.getMonth()+S.mOff,1), y=base.getFullYear(), mo=base.getMonth();
  const first=addDays(base,-((base.getDay()+6)%7)), tk=todayKey();
  const byDay=new Map(); for(const w of S.hist){ const k=dkey(w.s); if(!byDay.has(k)) byDay.set(k,[]); byDay.get(k).push(w); }
  const plansIn=S.plans.filter(p=>!p.who&&p.date&&p.date.slice(0,7)===dkey(base).slice(0,7));
  if(!S.mSel||S.mSel.slice(0,7)!==dkey(base).slice(0,7)) S.mSel=S.mOff===0?tk:(plansIn.map(p=>p.date).sort()[0]||dkey(base));
  let title=base.toLocaleDateString(LOC,{month:"long",year:"numeric"}); title=title.charAt(0).toUpperCase()+title.slice(1);
  let h='<div class="week"><div class="week-head"><button data-a="mnav" data-x="-1" aria-label="'+L("Предыдущий месяц")+'">‹</button><div><b>'+title+'</b><small>'+(S.mOff===0?L("Этот месяц"):"")+'</small></div><button data-a="mnav" data-x="1" aria-label="'+L("Следующий месяц")+'">›</button></div><div class="mgrid">'+
    WDS.map(d=>'<span class="wh">'+d+'</span>').join("");
  let done=0;
  for(let i=0;i<42;i++){ const d=addDays(first,i); if(i>=35&&d.getMonth()!==mo) break; const k=dkey(d), inM=d.getMonth()===mo;
    const has=byDay.has(k), pl=!!planOn(k); if(has&&inM) done+=byDay.get(k).length;
    h+='<button class="mday'+(inM?"":" out")+(k===tk?" today":"")+(k<tk&&!has?" past":"")+'" data-a="mday" data-x="'+k+'" aria-pressed="'+(S.mSel===k)+'" aria-label="'+d.getDate()+" "+MONG[d.getMonth()]+(has?L(", тренировка"):"")+(pl?L(", план"):"")+'">'+d.getDate()+'<i class="'+(has?"dn":pl?"pl":"no")+'"></i></button>'; }
  h+='</div><div class="mleg"><span><i style="background:var(--good)"></i>'+L("тренировка")+'</span><span><i style="box-shadow:inset 0 0 0 2px var(--accent)"></i>'+L("план")+'</span></div>'+
    '<div class="week-sum"><b>'+done+'</b> '+(done%10===1&&done%100!==11?L("тренировка"):done%10>=2&&done%10<=4&&(done%100<12||done%100>14)?L("тренировки"):L("тренировок"))+' · <b>'+plansIn.filter(p=>p.date>=tk).length+'</b> '+L("запланировано")+'</div></div>';
  const sd=fromKey(S.mSel), ws=byDay.get(S.mSel)||[], sp=planOn(S.mSel);
  h+='<h2>'+WDF[(sd.getDay()+6)%7]+", "+sd.getDate()+" "+MONG[sd.getMonth()]+'</h2>';
  if(ws.length) h+='<div class="stack">'+ws.map(histItem).join("")+'</div>';
  if(sp) h+='<div style="margin-top:10px">'+planCard(sp)+'</div>';
  if(!ws.length&&!sp) h+='<div class="empty sm">'+(S.mSel>=tk?L("На этот день ничего не запланировано."):L("В этот день тренировки не было."))+'</div>';
  if(!sp&&S.mSel>=tk) h+='<button class="addex" style="margin-top:10px" data-a="pnew" data-x="'+S.mSel+L('">+ Запланировать на этот день</button>');
  return h;
}
function viewWeek(){
  const start=weekStart(S.weekOff), end=addDays(start,7), now=new Date(), todayIdx=(now.getDay()+6)%7;
  const days=[...Array(7)].map((_,i)=>({date:addDays(start,i),ws:[]}));
  for(const w of S.hist){ if(w.s>=start.getTime() && w.s<end.getTime()){ const i=(new Date(w.s).getDay()+6)%7; days[i].ws.push(w); } }
  if(S.day==null){ S.day = S.weekOff===0 ? todayIdx : Math.max(0,days.findIndex(d=>d.ws.length)); }
  const last=addDays(start,6);
  const range=start.getDate()+(start.getMonth()!==last.getMonth()?" "+MON[start.getMonth()]:"")+" – "+last.getDate()+" "+MON[last.getMonth()];
  const label=S.weekOff===0?L("Эта неделя"):S.weekOff===-1?L("Прошлая неделя"):(-S.weekOff)+L(" нед. назад");
  let cnt=0,n=0,t=0,kk=0;
  let h=L('<div class="week"><div class="week-head"><button data-a="wkprev" aria-label="Предыдущая неделя">‹</button><div><b>')+range+'</b><small>'+label+'</small></div>'+
        L('<button data-a="wknext" aria-label="Следующая неделя"')+(S.weekOff>=0?" disabled":"")+'>›</button></div><div class="days">';
  days.forEach((d,i)=>{
    let dt=0,dn=0; d.ws.forEach(w=>{ const x=totals(w.sets); dt+=x.t; dn+=x.n; const k=kcal(w); if(k!=null) kk+=k; }); cnt+=d.ws.length; n+=dn; t+=dt;
    const has=d.ws.length>0, isToday=S.weekOff===0&&i===todayIdx, future=S.weekOff===0&&i>todayIdx;
    const du=toU(dt), mk= !has && planOn(dkey(d.date)) ? L("план") : has ? (du>=1000? fmt(Math.round(du/100)/10)+(isLb()?"k":L("т")) : du? fmt(Math.round(du))+U() : L("да")) : "";
    h+='<button class="day'+(has?" has":(planOn(dkey(d.date))?" plan":""))+(isToday?" today":"")+(future?" future":"")+'" data-a="day" data-x="'+i+'" aria-pressed="'+(S.day===i)+'" aria-label="'+WDF[i]+", "+d.date.getDate()+" "+MONG[d.date.getMonth()]+(has?L(", тренировка"):"")+'">'+
       '<span class="wd">'+WDS[i]+'</span><span class="dn">'+d.date.getDate()+'</span><span class="mk">'+mk+'</span></button>';
  });
  h+='</div><div class="week-sum">'+(cnt? '<b>'+cnt+'</b> '+(cnt===1?L("тренировка"):cnt<5?L("тренировки"):L("тренировок"))+' · <b>'+n+L('</b> раб. подходов · <b>')+ft(t)+'</b> '+U()+(kk?' · <b>≈'+fmt(kk)+L('</b> ккал'):"") : L("На этой неделе тренировок нет"))+'</div></div>';
  const sel=days[S.day];
  h+='<h2>'+WDF[S.day]+", "+sel.date.getDate()+" "+MONG[sel.date.getMonth()]+'</h2>';
  if(sel.ws.length) h+='<div class="stack">'+sel.ws.map(histItem).join("")+'</div>';
  else h+='<div class="empty sm">'+(S.weekOff===0&&S.day>todayIdx?L("Этот день ещё впереди."):S.weekOff===0&&S.day===todayIdx?L("Сегодня тренировки ещё не было."):L("В этот день тренировки не было."))+'</div>';
  const sk=dkey(sel.date), sp=planOn(sk);
  if(sp) h+='<div style="margin-top:10px">'+planCard(sp)+'</div>';
  else if(sk>=todayKey()) h+='<button class="addex" style="margin-top:10px" data-a="pnew" data-x="'+sk+L('">+ Запланировать на этот день</button>');
  return h;
}

function sessionsFor(x){
  const out=[];
  for(const w of [...S.hist].reverse()){
    const sets=w.sets.filter(s=>s[0]===x && !s[3]); if(!sets.length) continue;
    let best=sets[0]; for(const s of sets) if(e1rm(s[1],s[2])>e1rm(best[1],best[2])) best=s;
    out.push({d:w.s,best,e:e1rm(best[1],best[2]),t:totals(sets).t,n:sets.length});
  }
  return out;
}

function chart(pts){
  if(pts.length<2) return L('<div class="chart"><div class="cap">График появится после второй тренировки с этим упражнением.</div></div>');
  const W=340,H=170,PL=38,R=16,T=16,B=26, vals=pts.map(p=>p.e);
  let lo=Math.floor(Math.min(...vals)*0.96/5)*5, hi=Math.ceil(Math.max(...vals)*1.03/5)*5; if(hi-lo<10) hi=lo+10;
  const X=i=>PL+i*(W-PL-R)/(pts.length-1), Y=v=>T+(hi-v)*(H-T-B)/(hi-lo);
  const line=pts.map((p,i)=>(i?"L":"M")+X(i).toFixed(1)+" "+Y(p.e).toFixed(1)).join(" ");
  const area=line+" L"+X(pts.length-1).toFixed(1)+" "+(H-B)+" L"+PL+" "+(H-B)+" Z";
  const mid=(lo+hi)/2; let g="";
  for(const v of [lo,mid,hi]) g+='<line class="grid" x1="'+PL+'" x2="'+(W-R)+'" y1="'+Y(v)+'" y2="'+Y(v)+'"/><text class="lbl" x="'+(PL-6)+'" y="'+(Y(v)+3.5)+'" text-anchor="end">'+fmt(Math.round(v))+'</text>';
  const li=pts.length-1, lx=X(li), ly=Y(pts[li].e);
  return '<div class="chart"><svg viewBox="0 0 '+W+' '+H+L('" role="img" aria-label="Расчётный разовый максимум по тренировкам">')+g+
    '<path class="ar" d="'+area+'"/><path class="ln" d="'+line+'"/>'+
    pts.map((p,i)=>'<circle class="dot" cx="'+X(i)+'" cy="'+Y(p.e)+'" r="'+(i===li?4.5:2.5)+'"/>').join("")+
    '<text class="val" x="'+Math.min(lx,W-R)+'" y="'+Math.max(ly-10,11)+'" text-anchor="end">'+fmt(Math.round(pts[li].e))+'</text>'+
    '<text class="lbl" x="'+PL+'" y="'+(H-8)+'">'+dshort(pts[0].d)+'</text><text class="lbl" x="'+(W-R)+'" y="'+(H-8)+'" text-anchor="end">'+dshort(pts[li].d)+'</text>'+
    L('</svg><div class="cap">Расчётный 1ПМ (формула Эпли) по лучшему подходу каждой тренировки, ')+U()+'</div></div>';
}

function viewProg(){
  const used=new Map();
  for(const w of S.hist) for(const s of w.sets) if(!s[3]) used.set(s[0],(used.get(s[0])||0)+1);
  if(!used.size) return L('<div class="empty">Прогресс появится после первой завершённой тренировки.</div>');
  const list=[...used.entries()].sort((a,b)=>b[1]-a[1]).map(e=>e[0]);
  if(S.sel==null || !used.has(S.sel)) S.sel=list[0];
  const pts=sessionsFor(S.sel);
  let maxW=0,bestE=0,n=0,t=0; for(const p of pts){ n+=p.n; t+=p.t; bestE=Math.max(bestE,p.e); }
  for(const w of S.hist) for(const s of w.sets) if(s[0]===S.sel && !s[3]) maxW=Math.max(maxW,s[1]);
  let h=demoBar()+'<div class="pills">'+list.map(x=>'<button class="pill" data-a="sel" data-x="'+x+'" aria-pressed="'+(x===S.sel)+'">'+esc(S.ex[x])+'</button>').join("")+'</div>'+
    '<div class="h2row"><h2>'+esc(S.ex[S.sel])+'</h2><button class="renb" data-a="ren" data-x="ex:'+S.sel+'">'+PEN+L("Переименовать")+'</button></div><div class="tiles">'+
    '<div class="tile"><span class="num">'+fw(maxW)+L('</span><small>макс. вес, ')+U()+'</small></div>'+

/* planned sets as a column: "Первый подход    7,5 кг · 10 повторений"; done = how many are already completed */
function setLines(s,done){ let k=0;
  return '<ol class="setlist">'+s.map((z,j)=>'<li class="'+(done==null?"":j<done?"pdone":j===done?"pnext":"")+'"><span class="ord">'+(z[2]?L("Разминка")+'</span>':(ORD[k]||(k+1)+L("-й"))+(k++,L(' подход</span>')))+

function prevFact(p,x){
  const name=(S.ex[x]||"").toLowerCase(); if(!name) return "";
  const chipsOf=(sets,pl)=>{ const plw=pl?pl.filter(z=>!z[2]):null;
    return '<div class="sets">'+sets.map(([w,r],i)=>'<span class="chip'+vsPlan(w,r,plw&&plw[i])+'"><i>'+(i+1)+'</i>'+fw(w)+'<b>×</b>'+r+'</span>').join("")+'</div>'; };
  if(p.who!=null){
    if(!(p.who||"").trim()) return "";

    for(const r of [...own,...S.reps]){ if(!own.includes(r)&&!sameWho(repWho(r),p.who)&&!sameWho(r.c,p.who)) continue;
      const e=r.e.find(z=>String(z[0]).toLowerCase()===name); if(!e) continue;
      const sets=(e[1]||[]).filter(z=>z[1]>0), cm=(e[1]||[]).map((z,i)=>z[3]?(i+1)+": "+z[3]:"").filter(Boolean);

        (cm.length?'<div class="pfc">'+esc(cm.join(" · "))+'</div>':"")+(e[3]?'<div class="pfc">'+esc(e[3])+'</div>':"")+'</div>';
    }

  }
  for(const w of S.hist){ const sets=w.sets.filter(z=>z[0]===x&&!z[3]); if(!sets.length) continue;

  }
  return "";
}

function hashStr(t){ let h=5381; for(let i=0;i<t.length;i++) h=((h<<5)+h+t.charCodeAt(i))|0; return (h>>>0).toString(36); }
function b64u(bytes){ let s=""; for(const b of bytes) s+=String.fromCharCode(b); return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""); }
function unb64u(t){ t=t.replace(/-/g,"+").replace(/_/g,"/"); while(t.length%4) t+="="; const bin=atob(t); return Uint8Array.from(bin,c=>c.charCodeAt(0)); }
async function zip(bytes,inflate){ const st=inflate?new DecompressionStream("deflate-raw"):new CompressionStream("deflate-raw");
  return new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(st)).arrayBuffer()); }
async function encodeObj(o){
  const raw=new TextEncoder().encode(JSON.stringify(o));
  if(typeof CompressionStream!=="undefined"){ try{ const z=await zip(raw,false); if(z.length<raw.length) return "z"+b64u(z); }catch(_){} }
  return "j"+b64u(raw);
}
async function decodeObj(code){ const b=unb64u(code.slice(1)), raw=code[0]==="z"? await zip(b,true) : b; return JSON.parse(new TextDecoder().decode(raw)); }
const clamp=(v,a,z)=>Math.min(z,Math.max(a,+v||0));

function reportText(w){

  for(const [x,sets] of m){

    out.push("", (S.ex[x]||"?")+(pi?L(" (план ")+piText(pi)+")":""));

    if(w.notes&&w.notes[x]) out.push("💬 "+w.notes[x]);
  }
  if(w.plan) for(const pi of w.plan) if(!m.has(pi.x)) out.push("", (S.ex[pi.x]||"?")+L(": не выполнено"));
  const rs=restStats([...rests(w.sets).values()]);

}

  if(sp[0]==="m") return incomingMeal(sp,h);
  if(sp[0]==="g") return incomingGift(sp,h);

    if(!r){ openSheet(L('<h3>Не удалось открыть отчёт</h3><p class="muted">Ссылка повреждена. Попросите клиента отправить отчёт ещё раз.</p><button class="btn wide" data-a="close">Закрыть</button>'),"err"); return; }

}

const itT=it=>{ const g=it[1]/100; return {k:it[2]*g,p:it[3]*g,f:it[4]*g,c:it[5]*g}; };
function sumT(list){ const t={k:0,p:0,f:0,c:0}; for(const x of list){ t.k+=x.k; t.p+=x.p; t.f+=x.f; t.c+=x.c; } return t; }

/* best matches first: whole name, then name start, then word start, then anywhere */
function foodMatches(q){
  q=String(q||"").trim().toLowerCase();
  const own=S.foods.map((f,i)=>({n:f[0],v:f.slice(1),src:"c"+i})), db=FOODS.map((f,i)=>({n:f[FIDX],v:f.slice(3),src:"d"+i}));
  const all=[...own,...db]; if(!q) return all;
  const score=f=>{ const n=f.n.toLowerCase(); return n===q?0:n.startsWith(q)?1:n.split(/[\s(,]+/).some(w=>w.startsWith(q))?2:n.includes(q)?3:9; };
  return all.map((f,i)=>({f,s:score(f),i})).filter(x=>x.s<9).sort((a,b)=>a.s-b.s||a.i-b.i).map(x=>x.f);
}
function foodResults(q){
  const all=foodMatches(q).slice(0,7);
  if(!all.length) return '<div class="pct-msg">'+L("Такого продукта нет в списке. Впишите калории и БЖУ на 100 г с упаковки, и приложение его запомнит.")+'</div>';
  return all.map(f=>'<button class="fres'+(S._fsrc===f.src?" on":"")+'" data-a="fpick" data-x="'+f.src+'"><span>'+esc(f.n)+'</span><small>'+fK(f.v[0])+' '+L("ккал")+' · '+L("Б")+fG(f.v[1])+' '+L("Ж")+fG(f.v[2])+' '+L("У")+fG(f.v[3])+'</small></button>').join("");
}

    const scI=$("#sc"); if(scI && +scI.dataset.x===x) d.c=clean(scI.value,40);
    const ns=[x,d.w,d.r,d.wu?1:0,Math.round((Date.now()-S.act.s)/1000)]; if(d.c) ns[5]=d.c; d.c=""; S.act.sets.push(ns); S.rest.hidden=0; saveAct(); haptic("medium");
    const pi=S.act.plan&&S.act.plan.find(i=>i.x===x); if(pi){ const nx=pi.s[S.act.sets.filter(z=>z[0]===x).length]; if(nx){ d.w=nx[0]; d.r=nx[1]; d.wu=!!nx[2]; } }
    render(); },
  undo(x){ x=+x; for(let i=S.act.sets.length-1;i>=0;i--){ if(S.act.sets[i][0]===x){ S.act.sets.splice(i,1); break; } } saveAct(); haptic(); render(); },
  finish(){
    if(S.confirm!=="finish"){ S.confirm="finish"; render(); setTimeout(()=>{ if(S.confirm==="finish"){ S.confirm=null; render(); } },3500); return; }
    S.confirm=null; const a=S.act; S.act=null; S.rest.end=0; S.openEx=null; saveAct();
    if(!a.sets.length){ render(); return; }
    if(a.pid){ S.plans=S.plans.filter(p=>p.id!==a.pid); savePlans(); }
    const w={id:a.id,s:a.s,e:Date.now(),sets:a.sets}; const nt=Object.fromEntries(Object.entries(a.notes||{}).filter(([,v])=>v)); if(Object.keys(nt).length) w.notes=nt; if(a.pc&&Object.keys(a.pc).length) w.pc=a.pc; if(a.plan) w.plan=a.plan; if(a.pname) w.pname=a.pname; if(a.from) w.from=a.from; if(a.cpid) w.cpid=a.cpid; if(S.bw){ w.bw=S.bw; w.met=S.met; }
    S.hist.unshift(w); saveW(w); haptic("ok"); render(); openSheet(detail(w,L("Тренировка завершена")),"done"); },
  wk(id){ const w=S.hist.find(w=>w.id===id); if(w) openSheet(detail(w),"wk:"+id); },
  delwk(id){
    if(S.confirm!=="del"+id){ S.confirm="del"+id; const w=S.hist.find(w=>w.id===id); $("#sheetBody").innerHTML=detail(w); return; }
    S.hist=S.hist.filter(w=>w.id!==id); store.del("w_"+id); saveIdx(); closeSheet(); render(); },

  cleardemo(){ clearDemo(); },
  close(){ closeSheet(); },

  restskip(){ S.rest.hidden=lastSetTime(); renderRest(); },
  snd(){ S.snd=S.snd===false; saveCfg(); audioUnlock(); if(S.snd) beep("tick"); haptic(); renderRest(); }
};

/* next plan for a client from a saved report: "f:<id>" = what was actually done, "p:<id>" = the same plan again */
function planFromReport(r,useFact){
  const orig=S.plans.find(p=>p.id===r.pid)||null;
  const items=[];
  for(const [name,sets,pl] of r.e){
    let x=S.ex.findIndex(n=>n.toLowerCase()===String(name).toLowerCase()); if(x<0){ S.ex.push(String(name).slice(0,40)); x=S.ex.length-1; saveEx(); }
    const wu=(pl||[]).filter(z=>z[2]).map(z=>[z[0],z[1],1]);
    const done=(sets||[]).filter(z=>z[1]>0).map(z=>[z[0],z[1]]);
    const plw=(pl||[]).filter(z=>!z[2]).map(z=>[z[0],z[1]]);
    const work=useFact&&done.length?[...done,...plw.slice(done.length)]:plw; // sets the client skipped stay as planned
    if(!wu.length&&!work.length) continue;
    const it={x,s:[...wu,...work]}; const oi=orig&&orig.items.find(i=>i.x===x);
    if(oi){ if(oi.c) it.c=oi.c; if(oi.st) it.st=oi.st; }
    items.push(it);
  }
  let d=addDays(fromKey(r.d),7); const today=new Date(); today.setHours(0,0,0,0); while(d<=today) d=addDays(d,7);
  return {id:null,date:dkey(d),name:r.n||"",who:repWho(r),items,
    _src:(useFact?L("Составлено по факту отчёта от "):L("Повтор плана от "))+pdate(r.d)+L(". Проверьте веса и отправьте клиенту.")};
}

    S.pe=planFromReport(r,k==="f"); S.confirm=null; haptic("light"); openSheet(sheetPlan(),"plan"); }
});
/* rename: "act" (current workout), "w:<id>" (a saved workout), "ex:<x>[:plan|:w:<id>]" (an exercise everywhere) */
function sheetRen(key){
  const isEx=key.startsWith("ex:"), x=isEx?+key.split(":")[1]:null;
  const cur=isEx?S.ex[x]:key==="act"?(S.act&&S.act.pname)||"":((S.hist.find(w=>w.id===key.slice(2))||{}).pname)||"";
  return '<h3>'+(isEx?L("Название упражнения"):L("Название тренировки"))+'</h3>'+
    (isEx?'<p class="muted" style="margin:6px 0 0">'+L("Изменится везде: в истории, планах и прогрессе.")+'</p>':'<p class="muted" style="margin:6px 0 0">'+L("Например, «Верх тела» или «Ноги, тяжёлый день». Попадёт в отчёт тренеру.")+'</p>')+
    '<input class="field" id="rnm" style="margin-top:14px" maxlength="'+(isEx?40:30)+'" value="'+esc(cur)+'" placeholder="'+(isEx?L("Например, Жим лёжа"):L("Без названия"))+'" aria-label="'+L("Название")+'">'+
    '<div class="err" id="rnerr"></div><button class="btn primary wide" style="margin-top:14px" data-a="rnsave" data-x="'+esc(key)+'">'+L("Сохранить")+'</button>'+
    '<button class="btn wide" style="margin-top:8px" data-a="rnback" data-x="'+esc(key)+'">'+L("Отмена")+'</button>';
}
function renBack(key){ const p=key.split(":");
  if(p[0]==="ex"&&p[2]==="plan"&&S.pe) return openSheet(sheetPlan(),"plan");
  const wid=p[0]==="w"?p[1]:p[0]==="ex"&&p[2]==="w"?p[3]:null; const w=wid&&S.hist.find(h=>h.id===wid);
  if(w) return openSheet(detail(w),"wk:"+w.id);
  closeSheet(); render(); }
Object.assign(A,{
  ren(key){ if(key.endsWith(":plan")&&typeof syncPe==="function") syncPe(); openSheet(sheetRen(key),"ren"); setTimeout(()=>{ const i=$("#rnm"); if(i){ i.focus(); i.select(); } },60); },
  rnback(key){ renBack(key); },
  rnsave(key){ const v=($("#rnm").value||"").replace(/\s+/g," ").trim();
    if(key.startsWith("ex:")){ const x=+key.split(":")[1];
      if(!v){ $("#rnerr").textContent=L("Впишите название."); return; }
      const dup=S.ex.findIndex((n,i)=>i!==x&&n.toLowerCase()===v.toLowerCase());
      if(dup>=0){ $("#rnerr").textContent=L("Такое упражнение уже есть."); return; }
      S.ex[x]=v.slice(0,40); saveEx(); }
    else if(key==="act"){ if(!S.act) return closeSheet(); if(v) S.act.pname=v.slice(0,30); else delete S.act.pname; saveAct(); }
    else { const w=S.hist.find(h=>h.id===key.slice(2)); if(w){ if(v) w.pname=v.slice(0,30); else delete w.pname; saveW(w); } }
    haptic("ok"); render(); renBack(key); }
});

/* ---------- Telegram look and feel ---------- */
function applyTgTheme(){
  if(!inTG) return;
  const p=tg.themeParams||{}, r=document.documentElement.style;
  const map={bg:p.secondary_bg_color||p.bg_color, card:p.section_bg_color||p.bg_color, fg:p.text_color, muted:p.hint_color, accent:p.button_color, "on-accent":p.button_text_color};
  for(const k in map) if(map[k]) r.setProperty("--"+k,map[k]);
  if(p.secondary_bg_color) r.setProperty("--surface",p.bg_color&&p.bg_color!==p.secondary_bg_color?p.secondary_bg_color:"color-mix(in srgb,"+p.text_color+" 8%,"+p.bg_color+")");
  if(p.hint_color) r.setProperty("--line","color-mix(in srgb,"+p.hint_color+" 35%,transparent)");
  document.documentElement.setAttribute("data-theme",tg.colorScheme==="dark"?"dark":"light");
  try{ tg.setHeaderColor("secondary_bg_color"); tg.setBackgroundColor("secondary_bg_color"); }catch(_){}
}
if(inTG){
  tg.ready(); tg.expand(); applyTgTheme();
  tg.onEvent("themeChanged",applyTgTheme);
  if(tg.BackButton) tg.BackButton.onClick(closeSheet);
}
